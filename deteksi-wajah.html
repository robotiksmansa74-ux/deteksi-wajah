<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Mesh Drowsiness Detection Visualizer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Camera Utils & Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <!-- MediaPipe Drawing Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f8fafc;
            overflow: hidden;
        }
        .alarm-flash {
            animation: alarmGlow 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate;
        }
        @keyframes alarmGlow {
            from {
                box-shadow: inset 0 0 50px rgba(220, 38, 38, 0.2);
                border-color: rgba(239, 68, 68, 0.4);
            }
            to {
                box-shadow: inset 0 0 120px rgba(220, 38, 38, 0.8);
                border-color: rgba(239, 68, 68, 1);
            }
        }
        .mirror-canvas {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="w-screen h-screen bg-slate-950 flex items-center justify-center relative overflow-hidden">

    <!-- Hidden Video Source for MediaPipe Processing -->
    <video id="webcam" class="hidden" playsinline autoplay muted></video>

    <!-- Main Fullscreen Video & Full Face Mesh Overlay Canvas Container -->
    <div id="container" class="relative w-full h-full flex items-center justify-center p-2 sm:p-4">
        <canvas id="output_canvas" class="mirror-canvas w-full h-full object-cover rounded-3xl border-2 border-slate-800 transition-all duration-300"></canvas>
        
        <!-- Overlay Tombol Start / Minta Izin Kamera (Muncul Jika Kamera Belum Aktif) -->
        <div id="startOverlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-slate-950/90 backdrop-blur-md p-6 text-center">
            <div class="max-w-md flex flex-col items-center gap-4">
                <div class="w-16 h-16 rounded-full bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-2xl animate-pulse">
                    📷
                </div>
                <h2 class="text-xl font-bold text-white">Mulai Deteksi Wajah</h2>
                <p class="text-xs text-slate-400">Klik tombol di bawah untuk mengizinkan akses webcam dan mengaktifkan audio deteksi kantuk.</p>
                <button id="btnStart" class="px-6 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-sm transition-all shadow-lg shadow-cyan-500/25 active:scale-95 cursor-pointer">
                    Mulai Kamera & Audio
                </button>
            </div>
        </div>

        <!-- Subtle Floating Visual Status Overlay on Top-Left Corner -->
        <div id="statusBadge" class="absolute top-6 left-6 z-20 flex items-center gap-3 px-4 py-2 rounded-2xl bg-slate-900/80 backdrop-blur-md border border-slate-700/60 shadow-2xl pointer-events-none">
            <span id="statusDot" class="w-3 h-3 rounded-full bg-amber-500"></span>
            <span id="statusLabel" class="text-xs sm:text-sm font-semibold tracking-wide text-slate-200">MENUNGGU KAMERA...</span>
        </div>

        <!-- Banner Peringatan Mengantuk / Menguap -->
        <div id="alarmBanner" class="hidden absolute bottom-8 z-20 px-6 py-3.5 rounded-2xl bg-red-600/90 backdrop-blur-md border border-red-500 text-white font-extrabold text-sm sm:text-lg tracking-wider shadow-2xl animate-bounce pointer-events-none">
            ⚠️ PERINGATAN: DETEKSI KANTUK / MENGUAP!
        </div>
    </div>

    <script>
        // DOM Elements
        const webcamElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const alarmBanner = document.getElementById('alarmBanner');
        const container = document.getElementById('container');
        const statusBadge = document.getElementById('statusBadge');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const startOverlay = document.getElementById('startOverlay');
        const btnStart = document.getElementById('btnStart');

        // Default Thresholds (Diaktifkan otomatis tanpa interactive controls)
        const EAR_THRESHOLD = 0.21;
        const MAR_THRESHOLD = 0.52;
        const ALARM_DURATION_MS = 1200; // 1.2 detik pejam

        let eyeClosedStartTime = null;
        let isAlarmActive = false;
        let camera = null;

        // Audio Synth Generator (Web Audio API)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeepSound() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch (e) {
                console.error("Audio synth error:", e);
            }
        }

        // Distance & Ratio Calculations
        function euclideanDist(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function calculateEAR(landmarks, eyeIndices) {
            const p1 = landmarks[eyeIndices[0]];
            const p2 = landmarks[eyeIndices[1]];
            const p3 = landmarks[eyeIndices[2]];
            const p4 = landmarks[eyeIndices[3]];
            const p5 = landmarks[eyeIndices[4]];
            const p6 = landmarks[eyeIndices[5]];

            const distVert1 = euclideanDist(p2, p6);
            const distVert2 = euclideanDist(p3, p5);
            const distHoriz = euclideanDist(p1, p4);

            if (distHoriz === 0) return 0;
            return (distVert1 + distVert2) / (2.0 * distHoriz);
        }

        function calculateMAR(landmarks, mouthIndices) {
            const top = landmarks[mouthIndices[0]];
            const bottom = landmarks[mouthIndices[1]];
            const left = landmarks[mouthIndices[2]];
            const right = landmarks[mouthIndices[3]];

            const distVert = euclideanDist(top, bottom);
            const distHoriz = euclideanDist(left, right);

            if (distHoriz === 0) return 0;
            return distVert / distHoriz;
        }

        const LEFT_EYE = [33, 160, 158, 133, 153, 144];
        const RIGHT_EYE = [362, 385, 387, 263, 373, 380];
        const MOUTH = [13, 14, 78, 308];

        // MediaPipe Results Frame Handler
        function onResults(results) {
            // Resize canvas to match video dimensions
            canvasElement.width = webcamElement.videoWidth || window.innerWidth;
            canvasElement.height = webcamElement.videoHeight || window.innerHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Draw Webcam Feed Frame
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // 1. Gambar Full Face Mesh Tesselation (Seluruh Permukaan Wajah)
                drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {
                    color: 'rgba(56, 189, 248, 0.4)', // Cyan glowing mesh
                    lineWidth: 0.8
                });

                // 2. Gambar Kontur Wajah Utama (Face Oval)
                drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, {
                    color: 'rgba(129, 140, 248, 0.8)',
                    lineWidth: 1.5
                });

                // 3. Highlight Area Mata
                drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {
                    color: '#38bdf8',
                    lineWidth: 2
                });
                drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {
                    color: '#38bdf8',
                    lineWidth: 2
                });

                // 4. Highlight Area Bibir / Mulut
                drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {
                    color: '#f59e0b',
                    lineWidth: 2
                });

                // Deteksi Kelelahan & Menguap Otomatis
                const leftEAR = calculateEAR(landmarks, LEFT_EYE);
                const rightEAR = calculateEAR(landmarks, RIGHT_EYE);
                const avgEAR = (leftEAR + rightEAR) / 2.0;
                const MAR = calculateMAR(landmarks, MOUTH);

                let isTriggered = false;

                // Cek Mengantuk (Mata Tertutup)
                if (avgEAR < EAR_THRESHOLD) {
                    if (!eyeClosedStartTime) {
                        eyeClosedStartTime = performance.now();
                    }
                    if (performance.now() - eyeClosedStartTime >= ALARM_DURATION_MS) {
                        isTriggered = true;
                    }
                } else {
                    eyeClosedStartTime = null;
                }

                // Cek Menguap
                if (MAR > MAR_THRESHOLD) {
                    isTriggered = true;
                }

                // Trigger Alarm & Efek Visual
                if (isTriggered) {
                    playBeepSound();
                    alarmBanner.classList.remove('hidden');
                    canvasElement.classList.add('alarm-flash');
                    statusDot.className = "w-3 h-3 rounded-full bg-red-500 animate-ping";
                    statusLabel.textContent = "BAHAYA: KANTUK / MENGUAP!";
                    statusLabel.className = "text-xs sm:text-sm font-semibold tracking-wide text-red-400";
                } else {
                    alarmBanner.classList.add('hidden');
                    canvasElement.classList.remove('alarm-flash');
                    statusDot.className = "w-3 h-3 rounded-full bg-emerald-400 animate-pulse";
                    statusLabel.textContent = "SISTEM DETEKSI AKTIF";
                    statusLabel.className = "text-xs sm:text-sm font-semibold tracking-wide text-slate-200";
                }

            } else {
                statusDot.className = "w-3 h-3 rounded-full bg-amber-500";
                statusLabel.textContent = "MENCARI WAJAH...";
                statusLabel.className = "text-xs sm:text-sm font-semibold tracking-wide text-amber-400";
                alarmBanner.classList.add('hidden');
                canvasElement.classList.remove('alarm-flash');
            }

            canvasCtx.restore();
        }

        // Setup Face Mesh Model
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onResults);

        // Fungsi Memulai Kamera
        async function startCameraSystem() {
            initAudio();
            startOverlay.classList.add('hidden');
            statusLabel.textContent = "MEMBUKA KAMERA...";

            try {
                camera = new Camera(webcamElement, {
                    onFrame: async () => {
                        await faceMesh.send({ image: webcamElement });
                    },
                    width: 1280,
                    height: 720
                });

                await camera.start();
                statusDot.className = "w-3 h-3 rounded-full bg-emerald-400 animate-pulse";
                statusLabel.textContent = "SISTEM DETEKSI AKTIF";
            } catch (err) {
                console.error("Gagal membuka kamera:", err);
                startOverlay.classList.remove('hidden');
                statusDot.className = "w-3 h-3 rounded-full bg-red-600";
                statusLabel.textContent = "IZIN KAMERA DITOLAK / TIDAK DITEMUK";
                alert("Gagal mengakses webcam. Pastikan Anda mengizinkan akses kamera dan tidak ada aplikasi lain yang sedang menggunakannya.");
            }
        }

        btnStart.addEventListener('click', startCameraSystem);
    </script>
</body>
</html>
